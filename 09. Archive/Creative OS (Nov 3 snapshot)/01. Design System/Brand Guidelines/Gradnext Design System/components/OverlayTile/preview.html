<!doctype html>
<html>
<head><meta charset="utf-8"><title>OverlayTile — preview</title>
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;padding:var(--space-3)} .grid{display:grid;grid-template-columns:repeat(4,150px);gap:var(--space-2);padding:var(--space-3)}</style></head>
<body>
<div id="root"></div>
<script>
  var G = window.Gradnext, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'grid'},[['dusk','yellow'],['white','yellow'],['mist','midnight'],['night','yellow'],['dusk','white'],['white','periwinkle'],['night','periwinkle']].map(function(p){return h(G.OverlayTile,{key:p.join(),ground:p[0],fill:p[1],size:150,label:p[1]+' on '+p[0]});})));
</script>
</body>
</html>
