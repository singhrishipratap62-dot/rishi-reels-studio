<!-- @dsCard group="Data" height=460 width=1080 subtitle="Handle travels to the value, number counts with it, tag names it" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slider</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.cm{position:absolute;left:-10px;top:-10px;width:calc(100% + 20px);height:calc(100% + 20px);overflow:visible}.cm path{fill:none;stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.tag{position:absolute;padding:8px 16px;background:var(--signal-marker);font-size:32px;font-weight:600;color:var(--ink);white-space:nowrap}
.ticks{position:absolute;inset:0;pointer-events:none}.ticks i{position:absolute;width:24px;height:24px;border-color:var(--ink);border-style:solid;border-width:0}
.ticks i:nth-child(1){left:-2px;top:-2px;border-left-width:4px;border-top-width:4px}.ticks i:nth-child(2){right:-2px;top:-2px;border-right-width:4px;border-top-width:4px}
.ticks i:nth-child(3){left:-2px;bottom:-2px;border-left-width:4px;border-bottom-width:4px}.ticks i:nth-child(4){right:-2px;bottom:-2px;border-right-width:4px;border-bottom-width:4px}
@keyframes snap{0%,3%{opacity:0;transform:translateY(16px)}7%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
.f{height:460px}.lb{font-size:40px;font-weight:500;margin:40px 0 0;max-width:640px}.trk{position:relative;margin:72px 64px 0;height:8px;background:var(--line-strong)}
.fill{position:absolute;left:0;top:0;height:8px;background:var(--ink);width:0;animation:fl 4s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}
.hd{position:absolute;top:-24px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:var(--signal);border:6px solid var(--ink);box-sizing:border-box;left:0;animation:hl 4s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}
@keyframes fl{0%,15%{width:0}45%,100%{width:80%}}@keyframes hl{0%,15%{left:0}45%,100%{left:80%}}
.val{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);position:absolute;right:64px;top:40px;font-size:80px;font-weight:700;letter-spacing:-.025em}.ax{display:flex;justify-content:space-between;margin:28px 64px 0;font-size:32px;color:var(--ink-muted)}
.tag{left:560px;top:340px;opacity:0;animation:snap 4s var(--ease-settle, cubic-bezier(0.34, 1.3, 0.64, 1)) 1.9s infinite}</style></head>
<body>
<div class="f"><p class="lb">How strictly should it follow the rules?</p><div class="val" id="v">0%</div><div class="trk"><div class="fill"></div><div class="hd"></div></div>
<div class="ax"><span>0%</span><span>50%</span><span>100%</span></div><div class="tag">sweet spot<svg class="cm" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8V0h8M92 0h8v8M100 32v8h-8M8 40H0v-8"/></svg></div></div>
<script>var v=document.getElementById('v');function run(){var t0=performance.now()+600;function f(t){var p=Math.max(0,Math.min(1,(t-t0)/1200));p=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;v.textContent=Math.round(80*p)+'%';if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}run();setInterval(run,4000);</script>
</body></html>
