<!-- @dsCard group="Data" height=760 width=1080 subtitle="Bars grow on the grid, staggered; one bar in signal" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bar chart</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:760px}.ch{margin-top:96px;height:400px;border-bottom:4px solid var(--ink);background:repeating-linear-gradient(to top,transparent 0 98px,var(--line) 98px 100px);display:flex;align-items:flex-end;gap:48px;padding:0 24px}.b{flex:1;position:relative;height:var(--h);background:var(--ink);transform-origin:bottom;animation:gr 5s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}.b.k{background:var(--signal)}.b span{position:absolute;top:-56px;left:0;font-size:44px;font-weight:500;color:var(--ink)}.xl{display:flex;gap:48px;padding:16px 24px 0}.xl p{flex:1;margin:0;font-size:32px;color:var(--ink-muted)}@keyframes gr{0%,6%{transform:scaleY(0)}24%,88%{transform:scaleY(1);opacity:1}96%,100%{opacity:0}}</style></head>
<body>
<div class="f"><p class="lab">03 · COMPARISON</p><div class="ch">
<div class="b" style="--h:30%"><span>12</span></div><div class="b" style="--h:48%;animation-delay:.08s"><span>19</span></div><div class="b" style="--h:62%;animation-delay:.16s"><span>25</span></div><div class="b k" style="--h:95%;animation-delay:.24s"><span>38</span></div></div>
<div class="xl"><p>2023</p><p>2024</p><p>2025</p><p>2026</p></div><p class="cap" style="margin-top:32px">Source: [source], [date] · sample data</p></div>
<script></script>
</body></html>
