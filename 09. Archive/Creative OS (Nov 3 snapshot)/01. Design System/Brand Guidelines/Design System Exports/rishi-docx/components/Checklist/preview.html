<!-- @dsCard group="Diagrams" height=760 width=1080 subtitle="Rows tick and strike one by one with the voice" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Checklist</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.cm{position:absolute;left:-10px;top:-10px;width:calc(100% + 20px);height:calc(100% + 20px);overflow:visible}.cm path{fill:none;stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.tag{position:absolute;padding:8px 16px;background:var(--signal-marker);font-size:32px;font-weight:600;color:var(--ink);white-space:nowrap}
.ticks{position:absolute;inset:0;pointer-events:none}.ticks i{position:absolute;width:24px;height:24px;border-color:var(--ink);border-style:solid;border-width:0}
.ticks i:nth-child(1){left:-2px;top:-2px;border-left-width:4px;border-top-width:4px}.ticks i:nth-child(2){right:-2px;top:-2px;border-right-width:4px;border-top-width:4px}
.ticks i:nth-child(3){left:-2px;bottom:-2px;border-left-width:4px;border-bottom-width:4px}.ticks i:nth-child(4){right:-2px;bottom:-2px;border-right-width:4px;border-bottom-width:4px}
@keyframes snap{0%,3%{opacity:0;transform:translateY(16px)}7%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
.f{height:760px}.cl{width:760px;margin:40px 0 0 64px;background:var(--surface)}.cl .hd{background:var(--ink);color:var(--bg);font-size:32px;font-weight:600;letter-spacing:.04em;padding:12px 28px}
.row{display:flex;align-items:center;gap:28px;padding:22px 28px;font-size:44px}.bx{width:44px;height:44px;border:4px solid var(--ink);box-sizing:border-box;position:relative;flex:none}
.bx svg{position:absolute;left:2px;top:2px;opacity:0}.row.done .bx{background:var(--ink)}.row.done .bx svg{opacity:1}.row .t{position:relative}
.row .t:after{content:'';position:absolute;left:-4px;top:52%;height:4px;width:0;background:var(--ink);transition:width .2s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1))}.row.done .t{color:var(--ink-muted)}.row.done .t:after{width:calc(100% + 8px);background:var(--ink-muted)}</style></head>
<body>
<div class="f"><div class="cl"><div class="hd">TODAY'S TASKS</div>
<div class="row"><div class="bx"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M5 16 L13 24 L27 8" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="t">Write the code</span></div>
<div class="row"><div class="bx"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M5 16 L13 24 L27 8" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="t">Fix the bugs</span></div>
<div class="row"><div class="bx"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M5 16 L13 24 L27 8" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="t">Run the tests</span></div>
<div class="row"><div class="bx"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M5 16 L13 24 L27 8" fill="none" stroke="var(--bg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="t">Write the docs</span></div>
</div></div>
<script>var r=document.querySelectorAll('.row');function run(){r.forEach(function(x){x.classList.remove('done')});r.forEach(function(x,i){setTimeout(function(){x.classList.add('done')},600+i*550)})}run();setInterval(run,4800);</script>
</body></html>
