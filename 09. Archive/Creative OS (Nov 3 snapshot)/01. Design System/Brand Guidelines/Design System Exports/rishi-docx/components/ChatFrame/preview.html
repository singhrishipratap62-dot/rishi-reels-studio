<!-- @dsCard group="Context" height=760 width=1080 subtitle="Recreated AI conversation; highlighter on the key phrase" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat frame</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:760px}.ph{margin-top:48px;background:var(--surface);border-radius:var(--radius-lg);padding:40px;display:flex;flex-direction:column;gap:24px}.m{max-width:760px;padding:28px 36px;border-radius:var(--radius-lg);font-size:44px;line-height:1.35;opacity:0;animation:up 6s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}.me{align-self:flex-end;background:var(--ink);color:var(--bg)}.ai{background:var(--bg);color:var(--ink);animation-delay:.6s}.mk{border-radius:var(--radius-highlight, 6px);-webkit-box-decoration-break:clone;box-decoration-break:clone;background:var(--signal-marker);padding:0 6px}.who{font-size:32px;font-weight:500;color:var(--ink-muted);display:block;margin-bottom:8px}</style></head>
<body>
<div class="f"><p class="lab">WHAT THE AI SAID</p><div class="ph">
<div class="m me">Is this symptom serious?</div>
<div class="m ai"><span class="who">Chatbot</span>This is usually <span class="mk">not dangerous</span>. Just get some rest.</div></div>
<p class="cap" style="margin-top:24px">Recreated from [source] · rounded only because it's UI</p></div>
<script></script>
</body></html>
