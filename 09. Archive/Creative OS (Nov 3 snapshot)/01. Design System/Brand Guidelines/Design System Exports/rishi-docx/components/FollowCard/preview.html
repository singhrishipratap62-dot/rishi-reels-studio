<!-- @dsCard group="Titles" height=1180 width=1080 subtitle="End-of-reel follow card: photo, pen ring, name, handle, Follow → Following" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Follow end-card</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:1180px}
.av{position:relative;width:360px;height:360px;margin:88px 0 0;opacity:0;animation:pop 7s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}
.av img{width:360px;height:360px;border-radius:50%;object-fit:cover;display:block}
.av svg{position:absolute;left:-40px;top:-40px;width:440px;height:440px;overflow:visible}
.av path{stroke-dasharray:1000;animation:ring 7s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite}
@keyframes pop{0%,3%{opacity:0;transform:scale(.92)}12%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes ring{0%,12%{stroke-dashoffset:1000}22%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.nm{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:56px 0 0;opacity:0;animation:up 7s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) .35s infinite}
.hd{font-size:44px;font-weight:500;color:var(--ink-muted);margin:12px 0 0;opacity:0;animation:up 7s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) .45s infinite}
.ln{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);font-size:60px;line-height:1.15;font-weight:700;margin:64px 0 0;max-width:860px;opacity:0;animation:up 7s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) .6s infinite;letter-spacing:-.025em}
.row{position:relative;margin-top:56px;height:120px;opacity:0;animation:up 7s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) .8s infinite}
.btn{position:absolute;left:0;top:0;width:420px;height:120px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:48px;font-weight:600}
.b1{background:var(--ink);color:var(--bg)}
.b2{background:var(--surface);color:var(--ink);border:4px solid var(--ink);box-sizing:border-box;visibility:hidden}
.press{animation:press 7s var(--ease-settle, cubic-bezier(0.34, 1.3, 0.64, 1)) infinite}
@keyframes press{0%,46%{transform:none}49%{transform:scale(.94)}53%,100%{transform:none}}
.ar{position:absolute;left:460px;top:-30px;width:260px;height:180px;overflow:visible}
.ar path{stroke-dasharray:1000;animation:arw 7s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite}
@keyframes arw{0%,30%{stroke-dashoffset:1000}40%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.tk path{stroke-dasharray:1000;animation:tkd 7s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite}
@keyframes tkd{0%,54%{stroke-dashoffset:1000}62%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
</style></head>
<body>
<div class="f"><p class="lab">FOLLOW</p>
<div class="av"><img src="/_blob/3862d4689b70aeac843b0e949fe5dbd6" alt="Rishi"><svg viewBox="0 0 440 440" aria-hidden="true"><path class="pen" d="M300 34 C 170 0, 30 70, 26 210 C 22 350, 180 430, 300 396 C 410 364, 440 220, 392 120 C 368 74, 330 50, 280 40"/></svg></div>
<h2 class="nm">Rishi</h2>
<p class="hd">@rishi.docx</p>
<p class="ln">AI, explained <span class="it sig">without the hype</span></p>
<div class="row">
<div class="btn b1" id="b1"><span id="t1">Follow</span></div>
<div class="btn b2" id="b2"><svg class="tk" width="48" height="40" viewBox="0 0 48 40" aria-hidden="true"><path style="fill:none;stroke:var(--ink);stroke-width:7px;stroke-linecap:round;stroke-linejoin:round" d="M4 20 L 17 34 L 44 4"/></svg><span>Following</span></div>
<svg class="ar" viewBox="0 0 260 180" aria-hidden="true"><path class="pen" d="M240 30 C 170 40, 110 80, 40 120 M60 86 L 34 124 L 80 132"/></svg>
</div></div>
<script>var b1=document.getElementById('b1'),b2=document.getElementById('b2');
function cyc(){b1.style.visibility='visible';b2.style.visibility='hidden';b1.classList.remove('press');void b1.offsetWidth;b1.classList.add('press');
setTimeout(function(){b1.style.visibility='hidden';b2.style.visibility='visible'},3600);}
cyc();setInterval(cyc,7000);</script>
</body></html>
