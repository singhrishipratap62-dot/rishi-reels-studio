<!-- @dsCard group="Diagrams" height=1920 width=1080 subtitle="A dot-matrix map: push in, drop a pin, coordinate tag, photo card pinned beside it" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dot map</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.cap{position:absolute;left:50%;top:1380px;transform:translate(-50%,-50%);background:var(--brand-ink);color:var(--brand-paper);font-weight:600;font-size:34px;line-height:1.2;padding:10px 22px;border-radius:var(--radius-sm);white-space:nowrap}
.crop i{position:absolute;width:28px;height:28px;border:0 solid var(--ink-muted)}
.crop i:nth-child(1){left:64px;top:250px;border-left-width:3px;border-top-width:3px}
.crop i:nth-child(2){right:160px;top:250px;border-right-width:3px;border-top-width:3px}
.crop i:nth-child(3){left:64px;bottom:420px;border-left-width:3px;border-bottom-width:3px}
.crop i:nth-child(4){right:160px;bottom:420px;border-right-width:3px;border-bottom-width:3px}
.kick{display:flex;align-items:center;justify-content:center;gap:20px;font-size:32px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-muted)}
.kick:before,.kick:after{content:"";width:56px;height:2px;background:var(--line-strong)}
.serif{font-family:var(--font-serif);font-weight:400}
.it{font-family:inherit;font-style:normal;font-weight:inherit}
#map{position:absolute;left:0;top:0;transform-origin:540px 900px;transition:transform 1.4s var(--ease-cinematic, cubic-bezier(0.83, 0, 0.17, 1))}
#map.in{transform:scale(1.18)}
.pin{position:absolute;left:556px;top:1010px;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--signal);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--signal);transform:scale(0);transition:transform var(--dur-quick, 240ms) var(--ease-settle, cubic-bezier(0.34, 1.3, 0.64, 1))}
.pin.on{transform:none}
.ring{position:absolute;left:556px;top:1010px;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid var(--signal);opacity:0}
.ring.on{animation:pulse .7s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) 1}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(4)}}
.coord{position:absolute;left:150px;top:850px;display:flex;background:linear-gradient(var(--signal-marker),var(--signal-marker)),var(--bg);border:2px solid var(--ink);font-size:32px;font-weight:600;letter-spacing:.12em;line-height:1;transform-origin:right center;transform:scaleX(0);transition:transform var(--dur-quick, 240ms) var(--ease-settle, cubic-bezier(0.34, 1.3, 0.64, 1))}
.coord span{padding:12px 16px 10px}.coord.on{transform:none}
.photo{position:absolute;left:650px;top:1080px;width:280px;background:var(--bg);padding:14px 14px 0;box-shadow:var(--shadow-float);transform:rotate(3deg) scale(.9);opacity:0;transition:all var(--dur-normal, 400ms) var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1))}
.photo.on{opacity:1;transform:rotate(3deg)}
.photo .im{height:200px;background-color:var(--surface);background-image:radial-gradient(var(--ink) 30%,transparent 32%);background-size:12px 12px}
.photo .lb{font-size:32px;font-weight:600;letter-spacing:.12em;padding:14px 2px 12px}
.ttl{position:absolute;left:64px;top:300px}.ttl .kick{justify-content:flex-start}.ttl .kick:before{display:none}
</style></head>
<body><div class="f"><div class="crop"><i></i><i></i><i></i><i></i></div>
<div class="ttl"><div class="kick">Where it happened</div></div>
<svg id="map" width="1080" height="1920"></svg>
<div class="ring" id="r"></div><div class="pin" id="p"></div>
<div class="coord" id="k"><span>SAMPLE SITE · 12.97°N 77.59°E</span></div>
<div class="photo" id="ph"><div class="im"></div><div class="lb">THE LAB</div></div>
<div class="cap" id="c">right here</div></div>
<script>
var s=document.getElementById('map'),ns='http://www.w3.org/2000/svg',h='';
function inBlob(x,y){var a=(x-540)/300,b=(y-880)/360;var r=Math.sqrt(a*a+b*b);var t=Math.atan2(b,a);return r<1+0.18*Math.sin(3*t)+0.1*Math.cos(5*t)}
for(var y=440;y<1360;y+=22)for(var x=96;x<990;x+=22){var inside=inBlob(x,y),near=Math.hypot(x-556,y-1010)<170;
h+='<circle cx="'+x+'" cy="'+y+'" r="'+(inside?6:3)+'" fill="'+(inside?(near?'var(--ink)':'var(--line-strong)'):'var(--line)')+'"/>'}
s.innerHTML=h;
var p=document.getElementById('p'),r=document.getElementById('r'),k=document.getElementById('k'),ph=document.getElementById('ph');
function run(){[s,p,r,k,ph].forEach(function(e){e.classList.remove('in','on')});
setTimeout(function(){s.classList.add('in')},300);setTimeout(function(){p.classList.add('on');r.classList.add('on')},1800);
setTimeout(function(){k.classList.add('on')},2100);setTimeout(function(){ph.classList.add('on')},2500)}
run();setInterval(run,6000);
</script></body></html>
