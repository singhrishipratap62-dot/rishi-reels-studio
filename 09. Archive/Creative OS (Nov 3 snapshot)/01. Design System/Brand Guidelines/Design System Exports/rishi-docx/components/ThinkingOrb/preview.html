<!-- @dsCard group="Context" height=1760 width=1080 subtitle="Nine dotted 'AI is working' states, in ink; one red orb in context" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Thinking orb</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.kick{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 40px}
.kick:before,.kick:after{content:"";height:2px;width:40px;background:var(--line-strong,var(--ink-muted))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;row-gap:40px}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.well{width:100%;height:250px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.well canvas{display:block}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.lab b{color:var(--ink);font-weight:600}
.rule{height:2px;background:var(--line);margin:64px 0 40px}
.pb{display:flex;align-items:center;gap:32px;background:#fffdf8;padding:32px;box-shadow:var(--shadow-float);border-radius:24px}
[data-theme=ink] .pb{background:var(--surface)}
.pb .t{font-size:44px;line-height:1.3;flex:1}
.pb .t small{display:block;font-size:32px;color:var(--ink-muted);margin-top:8px}
.row{display:flex;align-items:center;gap:16px;margin-top:40px;font-size:32px;font-weight:500;color:var(--ink)}
.mk{background:var(--signal-marker);color:var(--brand-ink,#141414);padding:4px 12px}</style></head>

<div class="f">

<div class="grid" id="g"></div>
<div class="rule"></div>
<p class="kick">In context</p>

<p class="lab" style="margin-top:16px">Red orb: 20 &times; 2, dots 2.2&times;. One red moment per frame.</p>
