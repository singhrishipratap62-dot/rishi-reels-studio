<!-- @dsCard group="Context" height=640 width=1080 subtitle="What a person or organisation said, in Gambetta" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quote card</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:var(--font-serif);font-style:italic;font-weight:400;letter-spacing:0}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:640px}.q{font-family:var(--font-serif);font-size:64px;line-height:1.2;margin:48px 0 0;max-width:900px;opacity:0;animation:up 6s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) infinite}.mk{font-family:var(--font-serif);font-size:160px;line-height:.6;color:var(--signal);display:block;height:64px}.by{margin-top:40px;opacity:0;animation:up 6s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) .4s infinite}</style></head>
<body>
<div class="f"><p class="lab">ON RECORD</p><p class="q"><span class="mk">“</span>We did not expect the model to behave this way in a real setting.</p>
<div class="by"><p style="margin:0;font-size:44px;font-weight:500">[Speaker], [organisation]</p><p class="cap">[Report or statement], [date] · sample quote</p></div></div>
<script></script>
</body></html>
