<!-- @dsCard group="Diagrams" height=640 width=1080 subtitle="Myth vs reality: strike on the left, tick on the right" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Split compare</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:640px}.cols{display:grid;grid-template-columns:1fr 1fr;margin-top:56px;border-top:4px solid var(--ink)}.col{position:relative;padding:40px 40px 0 0;opacity:0;animation:up 6s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}.col+.col{border-left:2px solid var(--line-strong);padding-left:40px;animation-delay:.3s}.col h3{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);font-size:60px;font-weight:700;line-height:1.15;margin:24px 0 0;letter-spacing:-.025em}.col.m h3{color:var(--ink-muted)}.x{position:relative;display:inline-block}.x svg{position:absolute;left:-6px;top:50%;width:calc(100% + 12px);height:24px;margin-top:-12px;overflow:visible}.x path,.tk path{stroke-dasharray:1000;vector-effect:non-scaling-stroke;animation:ds 6s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite}.tk{position:absolute;right:16px;top:28px;width:72px;height:64px;overflow:visible}.tk path{animation-name:dt}@keyframes ds{0%,30%{stroke-dashoffset:1000}40%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}@keyframes dt{0%,44%{stroke-dashoffset:1000}54%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}</style></head>
<body>
<div class="f"><div class="cols"><div class="col m"><p class="lab">WHAT PEOPLE THINK</p><h3><span class="x">AI does it all<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path class="pen" d="M1 14 C 30 11, 65 12, 99 8"/></svg></span></h3></div>
<div class="col"><p class="lab">WHAT'S TRUE</p><svg class="tk" viewBox="0 0 72 64" aria-hidden="true"><path class="pen" d="M6 30 L 26 54 L 66 6"/></svg><h3>AI works when you guide it</h3></div></div></div>
<script></script>
</body></html>
