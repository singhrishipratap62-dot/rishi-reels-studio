<!-- @dsCard group="Titles" height=720 width=1080 subtitle="Dial rotates in, number turns from ghost to ink, title snaps beside it" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chapter dial</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.cm{position:absolute;left:-10px;top:-10px;width:calc(100% + 20px);height:calc(100% + 20px);overflow:visible}.cm path{fill:none;stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.tag{position:absolute;padding:8px 16px;background:var(--signal-marker);font-size:32px;font-weight:600;color:var(--ink);white-space:nowrap}
.ticks{position:absolute;inset:0;pointer-events:none}.ticks i{position:absolute;width:24px;height:24px;border-color:var(--ink);border-style:solid;border-width:0}
.ticks i:nth-child(1){left:-2px;top:-2px;border-left-width:4px;border-top-width:4px}.ticks i:nth-child(2){right:-2px;top:-2px;border-right-width:4px;border-top-width:4px}
.ticks i:nth-child(3){left:-2px;bottom:-2px;border-left-width:4px;border-bottom-width:4px}.ticks i:nth-child(4){right:-2px;bottom:-2px;border-right-width:4px;border-bottom-width:4px}
@keyframes snap{0%,3%{opacity:0;transform:translateY(16px)}7%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
.f{height:720px}.dial{position:absolute;left:-560px;top:-140px;width:1000px;height:1000px;border-radius:50%;border:3px dotted var(--line-strong);animation:rot 4s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}
@keyframes rot{0%,3%{transform:rotate(14deg);opacity:0}12%,90%{transform:none;opacity:1}97%,100%{opacity:0}}
.dot{position:absolute;left:432px;top:352px;width:20px;height:20px;border-radius:50%;background:var(--ink)}
.n{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);position:absolute;left:480px;top:250px;font-size:200px;line-height:.9;font-weight:800;letter-spacing:-.035em;animation:gh 4s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) infinite}
@keyframes gh{0%,6%{color:var(--ink-ghost);opacity:0}10%{opacity:1;color:var(--ink-ghost)}16%,90%{color:var(--ink);opacity:1}97%,100%{opacity:0}}
.t{position:absolute;left:740px;top:268px;opacity:0;animation:snap 4s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) .25s infinite}.t h3{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);margin:0;font-size:60px;font-weight:700;letter-spacing:-.025em}.t p{margin:8px 0 0;font-size:32px;color:var(--ink-muted);max-width:280px}
.o{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);position:absolute;font-size:72px;font-weight:700;color:var(--ink-ghost);opacity:0;animation:snap 4s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) .15s infinite;letter-spacing:-.025em}</style></head>
<body>
<div class="f"><div class="dial"></div><div class="dot"></div>
<div class="o" style="left:330px;top:40px">01</div><div class="n">02</div><div class="o" style="left:330px;top:540px">03</div><div class="o" style="left:220px;top:660px">04</div>
<div class="t"><h3>Diagrams</h3><p>Ask for a diagram instead of text.</p></div></div>
<script></script>
</body></html>
