<!-- @dsCard group="Diagrams" height=560 width=1080 subtitle="Spine draws across; dated stops land in sequence" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Timeline</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:560px}.tl{position:relative;margin-top:180px;height:4px}.sp{position:absolute;left:0;top:0;height:4px;background:var(--ink);animation:sp 6s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite}@keyframes sp{0%,6%{width:0}36%,88%{width:952px;opacity:1}96%,100%{opacity:0;width:952px}}.st{position:absolute;top:-10px;opacity:0;animation:up 6s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) infinite}.st i{display:block;width:24px;height:24px;background:var(--ink)}.st.k i{background:var(--signal)}.st p{margin:24px 0 0;font-size:44px;font-weight:500;white-space:nowrap}.st .lab{margin-top:8px;font-weight:400}</style></head>
<body>
<div class="f"><p class="lab">TIMELINE</p><div class="tl"><div class="sp"></div>
<div class="st" style="left:0;animation-delay:.3s"><i></i><p>2019</p><p class="lab">First step</p></div>
<div class="st" style="left:260px;animation-delay:.8s"><i></i><p>2023</p><p class="lab">It spreads</p></div>
<div class="st" style="left:520px;animation-delay:1.3s"><i></i><p>2025</p><p class="lab">Big shift</p></div>
<div class="st k" style="left:800px;animation-delay:1.8s"><i></i><p>Today</p><p class="lab">Now</p></div></div></div>
<script></script>
</body></html>
