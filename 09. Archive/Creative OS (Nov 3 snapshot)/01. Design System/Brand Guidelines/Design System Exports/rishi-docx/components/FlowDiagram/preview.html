<!-- @dsCard group="Diagrams" height=640 width=1080 subtitle="Nodes on the grid, connectors draw, pen circles the key step" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flow diagram</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:640px}.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:96px;margin-top:96px}.nd{border:4px solid var(--ink);background:var(--bg);padding:32px 24px;opacity:0;animation:up 6s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1)) infinite;position:relative;z-index:1}.nd h3{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);margin:16px 0 0;font-size:60px;font-weight:700;line-height:1.1;letter-spacing:-.025em}.ov{position:absolute;left:0;top:0;width:1080px;height:640px;pointer-events:none;z-index:2}.con{stroke:var(--line-strong);stroke-width:var(--stroke-rule);fill:none;stroke-dasharray:1000;animation:dc 6s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite}.ov .pen{stroke-dasharray:1000;animation:dpn 6s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite;z-index:2}@keyframes dc{0%,14%{stroke-dashoffset:1000}26%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}@keyframes dpn{0%,34%{stroke-dashoffset:1000}46%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}</style></head>
<body>
<div class="f"><p class="lab">HOW IT WORKS</p><div class="nodes">
<div class="nd"><p class="lab">01</p><h3>Input</h3></div><div class="nd" style="animation-delay:.09s"><p class="lab">02</p><h3>Model</h3></div><div class="nd" style="animation-delay:.18s"><p class="lab">03</p><h3>Output</h3></div></div>
<p class="cap" style="margin-top:80px">Label, then nodes, then connectors, then the pen on the step that matters.</p></div>
<svg class="ov" viewBox="0 0 1080 640" aria-hidden="true"><path class="con" d="M339 316 H 403"/><path class="con" d="M677 316 H 741"/>
<path class="pen" d="M600 214 C 480 190, 386 218, 396 296 C 404 374, 640 396, 690 322 C 724 266, 660 210, 560 210"/></svg>
<script></script>
</body></html>
