<!-- @dsCard group="Titles" height=640 width=1080 subtitle="Words stagger in; pen underline draws after" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hook title</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;box-sizing:border-box;padding:64px;overflow:hidden}
.grid{position:absolute;left:0;top:0;width:1080px;pointer-events:none}
.grid line{stroke:var(--line);stroke-width:var(--stroke-hair)}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0}
.cap{font-size:32px;line-height:1.3;color:var(--ink-muted);margin:0}
.pen{fill:none;stroke:var(--signal);stroke-width:var(--stroke-pen);stroke-linecap:round;stroke-linejoin:round}
.it{font-family:inherit;font-style:normal;font-weight:inherit;letter-spacing:inherit}
.sig{color:var(--signal)}
@keyframes up{0%,4%{opacity:0;transform:translateY(24px)}14%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.f{height:640px}.w{display:inline-block;opacity:0;animation:up 5s var(--ease-soft, cubic-bezier(0.4, 0, 0.2, 1)) infinite}h1{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);font-size:104px;line-height:1.08;font-weight:800;letter-spacing:-.035em;margin:40px 0 0;max-width:900px}.mkd{position:relative}.mkd svg{position:absolute;left:-4px;right:-8px;bottom:-14px;width:calc(100% + 12px);height:28px;overflow:visible}.mkd path{stroke-dasharray:1000;animation:d1 5s var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)) infinite;vector-effect:non-scaling-stroke}@keyframes d1{0%,34%{stroke-dashoffset:1000}46%,88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}</style></head>
<body>
<div class="f"><p class="lab">01 · STORY</p>
<h1><span class="w">AI</span> <span class="w">called</span> <span class="w">a</span> <span class="w">mother</span> <span class="w">in</span> <span class="w it sig mkd">her daughter's voice<svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><path class="pen" d="M1 18 C 30 14, 62 15, 96 12 q 2 0 3 -3"/></svg></span></h1>
<p class="cap" style="margin-top:56px">Bricolage ExtraBold + one phrase in signal, same face. Pen last.</p></div>

<script>document.querySelectorAll('.w').forEach(function(e,i){e.style.animationDelay=(i*0.05)+'s'})</script>
</body></html>
