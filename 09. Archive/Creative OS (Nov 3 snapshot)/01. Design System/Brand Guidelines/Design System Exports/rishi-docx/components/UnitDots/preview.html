<!-- @dsCard group="Data" height=1920 width=1080 subtitle="One dot per year, endpoints in signal, a bracket naming the span" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Unit dots</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.cap{position:absolute;left:50%;top:1380px;transform:translate(-50%,-50%);background:var(--brand-ink);color:var(--brand-paper);font-weight:600;font-size:34px;line-height:1.2;padding:10px 22px;border-radius:var(--radius-sm);white-space:nowrap}
.crop i{position:absolute;width:28px;height:28px;border:0 solid var(--ink-muted)}
.crop i:nth-child(1){left:64px;top:250px;border-left-width:3px;border-top-width:3px}
.crop i:nth-child(2){right:160px;top:250px;border-right-width:3px;border-top-width:3px}
.crop i:nth-child(3){left:64px;bottom:420px;border-left-width:3px;border-bottom-width:3px}
.crop i:nth-child(4){right:160px;bottom:420px;border-right-width:3px;border-bottom-width:3px}
.kick{display:flex;align-items:center;justify-content:center;gap:20px;font-size:32px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-muted)}
.kick:before,.kick:after{content:"";width:56px;height:2px;background:var(--line-strong)}
.serif{font-family:var(--font-serif);font-weight:400}
.it{font-family:inherit;font-style:normal;font-weight:inherit}
.head{position:absolute;left:64px;right:160px;top:330px}
.head .kick{justify-content:flex-start}.head .kick:before{display:none}
.head h2{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);margin:18px 0 0;font-size:80px;line-height:1.05;letter-spacing:-.025em;font-weight:700}
.wrap{position:absolute;left:64px;width:856px;top:860px}
.br{position:relative;height:70px;margin:0 9px 18px;opacity:0;transform:scaleX(0);transition:transform var(--dur-quick, 240ms) var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)),opacity .1s var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1))}
.br.on{opacity:1;transform:none}
.br:before{content:"";position:absolute;left:0;right:0;top:34px;border-top:2px solid var(--ink)}
.br i{position:absolute;top:22px;width:2px;height:26px;background:var(--ink)}.br i:first-child{left:0}.br i:last-child{right:0}
.br b{position:absolute;left:50%;top:0;transform:translateX(-50%);background:var(--bg);border:2px solid var(--ink);font-size:32px;font-weight:600;letter-spacing:.12em;padding:12px 16px 10px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(18,1fr);row-gap:14px}
.d{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);box-sizing:border-box;justify-self:center;transform:scale(0);transition:transform var(--dur-quick, 240ms) var(--ease-settle, cubic-bezier(0.34, 1.3, 0.64, 1))}
.d.on{transform:none}.d.f{background:var(--ink)}.d.s{background:var(--signal);border-color:var(--signal)}
.ax{display:flex;justify-content:space-between;margin-top:22px;font-size:32px;font-weight:500;color:var(--ink-muted)}
.note{margin-top:40px;font-size:32px;color:var(--ink-muted)}
</style></head>
<body><div class="f"><div class="crop"><i></i><i></i><i></i><i></i></div>
<div class="head"><div class="kick">Sample · one dot per year</div><h2 class="serif">The first time in <span class="it">34 years</span></h2></div>
<div class="wrap"><div class="br" id="br"><i></i><b>34 YEARS</b><i></i></div>
<div class="grid" id="g"></div><div class="ax"><span>1992</span><span>2009</span><span>2026</span></div>
<div class="note">Sample data for layout only.</div></div>
<div class="cap">in 34 years</div></div>
<script>
var g=document.getElementById('g'),br=document.getElementById('br'),ds=[];
for(var i=0;i<35;i++){var d=document.createElement('i');d.className='d'+(i==0||i==34?' s':(i%5==2?' f':''));g.appendChild(d);ds.push(d)}
function run(){br.classList.remove('on');ds.forEach(function(d){d.classList.remove('on')});
ds.forEach(function(d,i){setTimeout(function(){d.classList.add('on')},400+i*24)});setTimeout(function(){br.classList.add('on')},1500)}
run();setInterval(run,5000);
</script></body></html>
