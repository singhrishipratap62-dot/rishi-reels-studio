<!-- @dsCard group="Pen" height=720 width=1080 subtitle="Three strengths: Follow, Key line, The point" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Highlight</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;height:720px;box-sizing:border-box;padding:72px 96px;overflow:hidden}
.lab{font-size:32px;font-weight:500;letter-spacing:.04em;color:var(--ink-muted);margin:0 0 20px}
h2{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);font-weight:700;font-size:60px;line-height:1;letter-spacing:-.025em;margin:0 0 36px}
p.tx{font-size:44px;line-height:1.5;margin:0;color:var(--ink);transition:color var(--dur-quick, 240ms) var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1))}
.dim .w{color:var(--ink-ghost)}
.h{padding:2px 6px;margin:0 -2px;border-radius:var(--radius-highlight, 6px);-webkit-box-decoration-break:clone;box-decoration-break:clone;background-repeat:no-repeat;background-size:0% 100%;transition:background-size var(--dur-normal, 400ms) var(--ease-draw, cubic-bezier(0.45, 0, 0.2, 1)),color var(--dur-quick, 240ms) var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1))}
.dim .h{color:var(--ink)}
.l1{background-image:linear-gradient(var(--highlight-follow, #b02e1a29),var(--highlight-follow, #b02e1a29));transition-duration:1.1s;transition-timing-function:linear}
.l2{background-image:linear-gradient(var(--signal-marker, #b02e1a5c),var(--signal-marker, #b02e1a5c))}
.l3{background-image:linear-gradient(var(--signal-deep, #b02e1a),var(--signal-deep, #b02e1a))}
.h.on{background-size:100% 100%}.l3.on{color:var(--brand-paper)}
.key{display:flex;gap:40px;margin-top:56px;font-size:32px;font-weight:500;color:var(--ink-muted)}
.sw{display:inline-block;width:56px;height:28px;border-radius:var(--radius-highlight, 6px);vertical-align:-4px;margin-right:14px}
</style></head>
<body><div class="f">
<p class="lab">01 · REUTERS · SAMPLE ARTICLE</p>
<h2>IT firms slow fresher hiring</h2>
<p class="tx" id="p"><span class="w h l1">The largest IT services companies hired fewer graduates this year.</span> <span class="w h l2">Executives said AI tools now handle much of the entry-level work.</span> <span class="w">One CFO put it plainly:</span> <span class="w h l3">the pyramid is getting narrower.</span></p>
<div class="key"><span><span class="sw" style="background:var(--highlight-follow, #b02e1a29)"></span>1 · Follow</span><span><span class="sw" style="background:var(--signal-marker, #b02e1a5c)"></span>2 · Key line</span><span><span class="sw" style="background:var(--signal-deep, #b02e1a)"></span>3 · The point</span></div>
</div>
<script>
var p=document.getElementById('p'),hs=[].slice.call(p.querySelectorAll('.h'));
function run(){p.classList.remove('dim');hs.forEach(function(h){h.classList.remove('on')});
setTimeout(function(){p.classList.add('dim')},400);
hs.forEach(function(h,i){setTimeout(function(){h.classList.add('on')},700+i*1400)})}
run();setInterval(run,6400);
</script></body></html>
