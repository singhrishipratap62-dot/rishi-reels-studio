<!-- @dsCard group="Context" height=1920 width=1080 subtitle="A person in the story: photo in a paper card over a halftone circle, serif name, role tag" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Portrait card</title>
<style>@font-face{font-family:"Bricolage Grotesque";src:url(../../fonts/BricolageGrotesque-Variable.ttf) format("truetype");font-weight:200 800;font-style:normal}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.cap{position:absolute;left:50%;top:1380px;transform:translate(-50%,-50%);background:var(--brand-ink);color:var(--brand-paper);font-weight:600;font-size:34px;line-height:1.2;padding:10px 22px;border-radius:var(--radius-sm);white-space:nowrap}
.crop i{position:absolute;width:28px;height:28px;border:0 solid var(--ink-muted)}
.crop i:nth-child(1){left:64px;top:250px;border-left-width:3px;border-top-width:3px}
.crop i:nth-child(2){right:160px;top:250px;border-right-width:3px;border-top-width:3px}
.crop i:nth-child(3){left:64px;bottom:420px;border-left-width:3px;border-bottom-width:3px}
.crop i:nth-child(4){right:160px;bottom:420px;border-right-width:3px;border-bottom-width:3px}
.kick{display:flex;align-items:center;justify-content:center;gap:20px;font-size:32px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-muted)}
.kick:before,.kick:after{content:"";width:56px;height:2px;background:var(--line-strong)}
.serif{font-family:var(--font-serif);font-weight:400}
.it{font-family:inherit;font-style:normal;font-weight:inherit}
.ttl{position:absolute;left:64px;right:160px;top:330px}.ttl .kick{justify-content:center}
.card{position:absolute;left:250px;top:520px;width:420px;background:var(--bg);padding:20px;box-shadow:var(--shadow-float);border:2px solid var(--line);opacity:0;transform:translateY(24px) rotate(-2deg);transition:all var(--dur-normal, 400ms) var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1))}
.card.on{opacity:1;transform:rotate(-2deg)}
.ph{position:relative;height:460px;overflow:hidden;background:var(--surface)}
.ph:before{content:"";position:absolute;left:50%;top:46%;width:360px;height:360px;transform:translate(-50%,-50%);border-radius:50%;background-image:radial-gradient(var(--signal) 32%,transparent 34%);background-size:14px 14px;opacity:.55}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;filter:grayscale(1) contrast(1.1);mix-blend-mode:multiply}
.yr{position:absolute;right:-18px;top:-18px;background:var(--signal-marker);border:2px solid var(--ink);font-size:32px;font-weight:600;letter-spacing:.12em;padding:10px 14px 8px;line-height:1}
.nm{font-family:var(--font-display, "Bricolage Grotesque", "General Sans", sans-serif);position:absolute;left:64px;right:160px;top:1080px;text-align:center;font-size:80px;line-height:1.05;opacity:0;transition:opacity var(--dur-quick, 240ms) var(--ease-smooth, cubic-bezier(0.65, 0, 0.35, 1));font-weight:700;letter-spacing:-.025em}
.role{position:absolute;left:50%;top:1200px;transform:translateX(-50%) scaleX(0);transform-origin:left center;display:flex;background:var(--bg);border:2px solid var(--ink);font-size:32px;font-weight:600;letter-spacing:.12em;line-height:1;transition:transform var(--dur-quick, 240ms) var(--ease-settle, cubic-bezier(0.34, 1.3, 0.64, 1))}
.role:before{content:"";width:10px;background:var(--signal)}.role span{padding:12px 16px 10px;white-space:nowrap}
.on.nm{opacity:1}.role.on{transform:translateX(-50%)}
</style></head>
<body><div class="f"><div class="crop"><i></i><i></i><i></i><i></i></div>
<div class="ttl"><div class="kick">Who noticed</div></div>
<div class="card" id="cd"><div class="ph"><img src="/_blob/ef1a2b62a299af5316a8e4ef8172d46b" alt=""></div><div class="yr">2026</div></div>
<div class="nm serif" id="n">Sample Name</div>
<div class="role" id="r"><span>FOUNDER · SAMPLE CO</span></div>
<div class="cap" id="c">the founder</div></div>
<script>
var cd=document.getElementById('cd'),n=document.getElementById('n'),r=document.getElementById('r');
function run(){[cd,n,r].forEach(function(e){e.classList.remove('on')});
setTimeout(function(){cd.classList.add('on')},300);setTimeout(function(){n.classList.add('on')},700);setTimeout(function(){r.classList.add('on')},1100)}
run();setInterval(run,5000);
</script></body></html>
