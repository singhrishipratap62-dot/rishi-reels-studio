<script>
  var SRT = '1\n00:00:00,180 --> 00:00:00,680\nLucknow\n\n2\n00:00:00,680 --> 00:00:01,640\npaid 27\n\n3\n00:00:01,640 --> 00:00:02,020\ncrore\n\n4\n00:00:02,020 --> 00:00:02,540\nrupees for\n\n5\n00:00:02,540 --> 00:00:02,960\nRishabh\n\n6\n00:00:02,960 --> 00:00:03,540\nPant, and\n\n7\n00:00:03,540 --> 00:00:04,160\ntwo years\n\n8\n00:00:04,160 --> 00:00:04,560\nlater,\n\n9\n00:00:04,560 --> 00:00:05,320\nthey traded him\n\n10\n00:00:05,320 --> 00:00:05,920\nto Delhi\n\n11\n00:00:05,920 --> 00:00:06,840\nfor 15 crore\n\n12\n00:00:06,840 --> 00:00:07,420\nrupees.';

  var phrases = C.phrasesFromWords(C.wordsFromSrt(SRT), 7.6);
