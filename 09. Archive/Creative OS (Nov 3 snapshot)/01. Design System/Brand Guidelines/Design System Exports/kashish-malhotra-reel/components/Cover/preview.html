<!-- @dsCard height=300 -->
<style>
  .cv { position:relative; width:960px; height:300px; background:var(--ground); font-family:var(--font-caption) }
  .k { fill:var(--caption-pill) } .y { fill:var(--accent) } .g { fill:var(--chroma-key) } .w { fill:var(--caption-text) }
  .cv h1 { position:absolute; left:40px; top:158px; margin:0; font-size:64px; line-height:.95; font-weight:800; letter-spacing:-0.02em; color:var(--ink) }
  .cv p { position:absolute; left:40px; top:232px; margin:0; font-size:14px; color:#4a4a4a; max-width:440px }
</style>
<div class="cv">
  <svg width="960" height="120" viewBox="0 0 960 120" style="position:absolute;left:0;top:0">
    <!-- blocks: caption-pill (black) slab 0-520, accent (yellow) 520-760, chroma-key (green) 760-960; band 112px = cap-height -->
    <!-- arrangement: one horizontal strip of unequal bands bleeding off the top, like a caption bar across the frame -->
    <!-- pattern: pills from cap-radius (30px) and cap-height, rising in steps of cap-exit, because every caption sits in a pill and rises -->
    <!-- scales: band 112px (cap-height), pill radius 30px (cap-radius), pill steps 46px (cap-exit), gaps 42px (cap-pad-x) -->
    <rect class="k" x="0" y="0" width="520" height="112"/>
    <rect class="y" x="520" y="0" width="240" height="112"/>
    <rect class="g" x="760" y="0" width="200" height="112"/>
    <rect class="w" x="42" y="40" width="150" height="60" rx="30"/>
    <rect class="w" x="234" y="26" width="110" height="60" rx="30"/>
    <rect class="y" x="386" y="12" width="92" height="60" rx="30"/>
    <rect class="k" x="562" y="26" width="156" height="60" rx="30"/>
    <rect class="k" x="802" y="40" width="116" height="60" rx="30"/>
  </svg>
  <h1>Kashish Malhotra reel</h1>
  <p>Captions that rise word by word, timed to the voice.</p>
</div>
