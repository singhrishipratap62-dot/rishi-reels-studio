<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{
  --navy:#2C3552; --ink:#2B2F3A; --grey:#8A8FA0; --accent:#5670FC; --acc-l:#E3E6FD; --acc-xl:#EEF0FE;
  --white:#fff; --hl:#FFE9A8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:'Avenir Next';color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
/* ---------- S3 background ---------- */
#bg{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 120% 90% at 0% 100%, #CFD7FD 0%, rgba(207,215,253,0) 70%),
    radial-gradient(ellipse 110% 80% at 100% 100%, #DBE0FC 0%, rgba(219,224,252,0) 70%),
    radial-gradient(ellipse 90% 60% at 100% 0%, #E6E9FD 0%, rgba(230,233,253,0) 75%),
    #FDFDFD;}
#dots{position:absolute;inset:0 0 50% 0;
  background-image:radial-gradient(circle, rgba(86,112,252,.16) 1.6px, transparent 2px);background-size:36px 36px;
  -webkit-mask-image:linear-gradient(#000 0%, rgba(0,0,0,.6) 60%, transparent 100%)}
#glow{position:absolute;left:136px;top:858px;width:810px;height:908px;border-radius:28px;background:#C9CEFB;
  box-shadow:0 0 80px 30px rgba(180,188,250,.85)}
/* ---------- board card ---------- */
#card{position:absolute;left:38px;top:141px;width:1003px;height:564px;background:#fff;border-radius:32px;
  box-shadow:0 10px 40px rgba(60,70,140,.10), 0 1px 3px rgba(60,70,140,.06);overflow:hidden}
.hdr{position:absolute;left:32px;right:32px;top:22px;height:40px;display:flex;align-items:center;gap:12px}
.hdr .t{font-weight:400;font-size:19px;color:var(--grey)}
.pill-part{font-weight:600;font-size:17px;color:var(--accent);background:var(--acc-l);padding:4px 12px;border-radius:999px}
.hdr .brand{margin-left:auto;font-weight:600;font-size:26px;color:var(--navy);letter-spacing:-.3px}
.el{position:absolute;will-change:transform,opacity}
/* typographic components */
.lbl{font-weight:500;font-size:18px;letter-spacing:1.6px;text-transform:uppercase;color:var(--grey)}
.h1{font-weight:600;font-size:42px;color:var(--ink);letter-spacing:-.5px}
.big{font-weight:600;font-size:84px;color:var(--ink);letter-spacing:-1.5px;line-height:1}
.mid{font-weight:600;font-size:34px;color:var(--ink);letter-spacing:-.4px}
.sub{font-weight:500;font-size:22px;color:var(--grey)}
.qbox{border:2.5px solid var(--navy);border-radius:18px;font-weight:600;font-size:27px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;background:#fff}
.qp{background:var(--acc-l);color:var(--navy);border-radius:12px;font-weight:600;font-size:19px;height:40px;
  display:flex;align-items:center;padding:0 14px;white-space:nowrap}
.ap{background:#fff;border:2px solid var(--accent);color:var(--ink);border-radius:12px;font-weight:500;font-size:19px;height:40px;
  display:flex;align-items:center;padding:0 14px;white-space:nowrap}
.fl{color:var(--grey);font-weight:500;font-size:19px;height:40px;display:flex;align-items:center;white-space:nowrap}
.fv{background:#fff;border:2px solid var(--accent);color:var(--ink);border-radius:12px;font-weight:600;font-size:21px;height:40px;
  display:flex;align-items:center;padding:0 14px;white-space:nowrap}
.arrow{color:var(--grey);font-size:20px;height:40px;display:flex;align-items:center}
.pill{background:var(--acc-xl);color:var(--navy);border-radius:999px;font-weight:600;font-size:24px;padding:10px 22px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.chip{background:#fff;border:2px solid #D7DBF5;color:var(--ink);border-radius:14px;font-weight:600;font-size:24px;height:48px;
  display:inline-flex;align-items:center;padding:0 16px;white-space:nowrap}
.chip.res{background:var(--acc-l);border-color:var(--acc-l);color:var(--navy)}
.chip.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.ph{border:2.5px dashed #B9C0F5;border-radius:20px;color:#9AA3E8;font-weight:600;font-size:56px;display:flex;align-items:center;justify-content:center;letter-spacing:8px}
.stamp{border:3px solid var(--accent);color:var(--accent);border-radius:10px;font-weight:700;font-size:22px;letter-spacing:2px;padding:6px 14px;transform:rotate(-6deg)}
.tick{color:#2FA36B;font-weight:700}
.cross{color:#E0524B;font-weight:700}
/* tabs */
.tab{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:500;color:var(--grey)}
.tab .dot{width:14px;height:14px;border-radius:50%;background:#C9CDDD}
.tab.on{color:var(--navy);font-weight:700}.tab.on .dot{background:var(--accent)}
.tab.off{color:#C2C5D2;text-decoration:line-through}.tab.off .dot{background:#E1E3EC}
/* number line */
.axis{height:4px;background:#D9DCEB;border-radius:2px}
.range{height:10px;background:var(--acc-l);border-radius:5px}
.mk{display:flex;flex-direction:column;align-items:center;transform:translateX(-50%)}
.mk .ml{font-weight:600;font-size:20px;color:var(--ink);white-space:nowrap;padding:2px 8px;border-radius:6px}
.mk .ms{font-weight:500;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--grey)}
.mk .stem{width:3px;background:var(--navy);border-radius:2px}
.mk.grey .stem{background:#B7BBCB}.mk.grey .ml{color:var(--grey)}
.mk .hlbar{position:absolute;left:0;right:0;bottom:0;height:45%;background:var(--hl);border-radius:4px;z-index:-1;transform-origin:left}
.axl{font-size:14px;color:var(--grey);font-weight:500;transform:translateX(-50%)}
/* bars */
.sbar{display:flex;height:46px;border-radius:10px;overflow:hidden;transform-origin:left}
.sbar > div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:19px;white-space:nowrap}
.yb{display:flex;gap:8px}.yb > div{flex:1;height:40px;border-radius:8px;background:var(--acc-xl);position:relative;overflow:hidden}
.yb > div i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.yb > div b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--navy);z-index:1}
.grid{display:grid;gap:5px}.grid > div{width:16px;height:16px;border-radius:4px;background:var(--accent)}
svg.ic{overflow:visible}
svg.ic .s{fill:none;stroke:var(--navy);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg.ic .f{fill:var(--acc-l);stroke:none}
/* ---------- end card ---------- */
.ec{display:flex;flex-direction:column;align-items:center;gap:18px}
.ec .b{font-weight:600;font-size:72px;color:var(--navy);letter-spacing:-1px}
.ec .s{font-weight:400;font-size:30px;color:var(--grey)}
.ec .p{font-weight:600;font-size:24px;color:var(--accent);background:var(--acc-l);padding:6px 18px;border-radius:999px}
.ec .f{font-weight:600;font-size:28px;color:#fff;background:var(--navy);padding:16px 36px;border-radius:999px}
/* ---------- hook ---------- */
#hookpanel{position:absolute;left:0;top:0;width:1080px;height:750px;background:#fff}
#hookpanel .hdr{left:48px;right:48px;top:36px}
#hookimg{position:absolute;left:48px;top:112px;width:470px;height:352px;border-radius:24px;overflow:hidden;background:#111}
#hookimg img{width:100%;height:100%;object-fit:cover}
#hookq .qw{color:rgba(43,47,58,.22)}
#hookq{position:absolute;left:556px;top:112px;width:480px;height:352px;display:flex;align-items:center;font-weight:600;font-size:44px;line-height:1.18;color:var(--ink);letter-spacing:-.6px}
#mbb{position:absolute;left:0;right:0;top:494px;height:96px;display:flex;justify-content:center;align-items:center;gap:56px}
#mbb .lg{font-size:30px;color:var(--navy)}
#mbb .sep{width:2px;height:40px;background:#E1E3EC}
#mbbl{position:absolute;left:0;right:0;top:640px;text-align:center}
/* ---------- caption ---------- */
#cap{position:absolute;left:0;width:1080px;top:770px;height:62px;display:flex;justify-content:center;align-items:center;white-space:nowrap}
#cap.left{justify-content:flex-start;padding-left:72px}
#cap .w{display:inline-block;font-weight:600;font-size:52px;color:var(--navy);margin-right:.26em;letter-spacing:-.3px}
#cap.onvideo .w{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
</style></head>
<body>
<div id="stage">
  <div class="scene" id="s1"><div id="hookpanel"></div></div>
  <div class="scene" id="s3"><div id="bg"></div><div id="dots"></div><div id="glow"></div>
    <div id="card"><div class="hdr" id="cardhdr"></div><div id="els"></div></div></div>
  <div id="cap"></div>
</div>
<script>
// ===== engine (generic). Data injected: WORDS (array {w,s,e}), CFG (from beats.js) =====
const FPS = 30000/1001, clamp=(x)=>Math.max(0,Math.min(1,x)), eo=(p)=>1-Math.pow(1-p,3), eio=(p)=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const N = s => s.toLowerCase().replace(/[₹,]/g,'').replace(/[^a-z0-9&']/g,'');
function at(phrase, word, occ=1){ // time of `word` inside first(occ) match of phrase
  const P = phrase.split(/\s+/).map(N), Wn = WORDS.map(x=>N(x.w)); let seen=0;
  for(let i=0;i+P.length<=Wn.length;i++){ let ok=true; for(let k=0;k<P.length;k++) if(Wn[i+k]!==P[k]){ok=false;break}
    if(ok && ++seen===occ){ const tw = word? P.indexOf(N(word)) : 0; if(tw<0) throw 'word '+word+' not in '+phrase; return WORDS[i+tw].s; } }
  throw 'phrase not found: '+phrase;
}
function hdrHTML(part){return `<span class="t">Solving real consultant cases</span><span class="pill-part">Part ${part}</span><span class="brand">gradnext</span>`}  // R1.17: header back (not on end card)
let ELS=[], QW=[];
function build(){
  CFG.init(at);
  if(CFG.bgVideo){ document.getElementById('bg').style.display='none'; document.getElementById('dots').style.display='none'; }
  document.getElementById('cardhdr').innerHTML = hdrHTML(CFG.part);
  const H = document.getElementById('hookpanel');
  const qw = CFG.hookQ.split(' ').map(w=>`<span class="qw">${w}</span>`).join(' ');
  const mbb = (CFG.mbbImg && CFG.mbbImg.startsWith('data:')) ? `<img src="${CFG.mbbImg}" style="height:${CFG.mbbH||92}px;mix-blend-mode:multiply">` :
    `<span class="lg" style="font-family:Georgia,serif">McKinsey &amp; Company</span><span class="sep"></span>
    <span class="lg" style="font-weight:700;font-size:40px;letter-spacing:1px">BCG</span><span class="sep"></span>
    <span class="lg" style="font-weight:700;letter-spacing:.5px">BAIN &amp; COMPANY</span>`;
  H.innerHTML = `<div class="hdr">${hdrHTML(CFG.part)}</div><div id="hookimg"><img src="${CFG.hookImg}"></div><div id="hookq"><div>${qw}</div></div><div id="mbb">${mbb}</div>`;
  QW=[...H.querySelectorAll('.qw')];
  const host = document.getElementById('els');
  for(const e of CFG.els){
    const d = document.createElement('div'); d.className='el '+(e.cls||''); d.innerHTML = e.html||'';
    Object.assign(d.style,{left:(e.x||0)+'px',top:(e.y||0)+'px'}); if(e.w) d.style.width=e.w+'px'; if(e.h) d.style.height=e.h+'px';
    if(e.z) d.style.zIndex=e.z; host.appendChild(d); e.node=d;
    e.paths=[...d.querySelectorAll('svg.ic .s')]; e.fills=[...d.querySelectorAll('svg.ic .f')];
    e.paths.forEach(p=>{p.setAttribute('pathLength','1');p.style.strokeDasharray='1';});
    e.counts=[...d.querySelectorAll('[data-to]')]; e.bars=[...d.querySelectorAll('[data-bar]')];
    e.units=[...d.querySelectorAll('.grid > div')]; e.subs=[...d.querySelectorAll('[data-in]')];
    ELS.push(e);
  }
  buildCaptions();
}
function fmtN(n,f){ const r=Math.round(n); const s=r.toLocaleString('en-IN'); return (f||'{n}').replace('{n}',s); }
function seekEl(e,t){
  const d=e.node; let op=0, dy=0, dx=0;
  if(t>=e.in){ const p=clamp((t-e.in)/(e.dur||0.22)); op=eo(p); dy=(e.m==='drop'?-8:8)*(1-eo(p)); if(e.m==='pop'){dy=0} }
  if(e.out!=null && t>=e.out){ op*=1-clamp((t-e.out)/0.25); }
  if(e.m==='pop' && t>=e.in){ const p=clamp((t-e.in)/0.22); d.style.transform=`scale(${0.85+0.15*eo(p)})`; }
  else d.style.transform=`translate(${dx}px,${dy}px)`+(e.rot?` rotate(${e.rot}deg)`:'');
  if(e.moves){ let x=e.x,y=e.y,w=e.w,h=e.h,fs=null;
    for(const mv of e.moves){ if(t>=mv.t){ const p=eio(clamp((t-mv.t)/0.3)); x+= (mv.x-x)*p; y+=(mv.y-y)*p; if(mv.w) w+=(mv.w-w)*p; if(mv.h) h+=(mv.h-h)*p; if(mv.fs) fs=e.fs+(mv.fs-e.fs)*p; } }
    Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'}); if(fs) d.style.fontSize=fs+'px'; }
  d.style.opacity=op; d.style.display = op<=0.001?'none':'';
  if(op<=0.001) return;
  e.paths.forEach(p=>{ const q=clamp((t-e.in)/0.4); p.style.strokeDashoffset=1-eo(q); });
  e.fills.forEach(f=>{ f.style.opacity=clamp((t-e.in-0.35)/0.2); });
  e.counts.forEach(c=>{ const t0=+(c.dataset.at||e.in), to=+c.dataset.to, fr=+(c.dataset.from ?? to*0.6); const p=eo(clamp((t-t0)/0.45));
    c.textContent=fmtN(fr+(to-fr)*p, c.dataset.fmt); });
  e.bars.forEach(b=>{ const t0=+(b.dataset.at||e.in), du=+(b.dataset.dur||0.5); b.style.transform=`scaleX(${eio(clamp((t-t0)/du))})`; });
  e.units.forEach((u,i)=>{ const p=clamp((t-e.in-i*(e.step||0.05))/0.12); u.style.opacity=p; u.style.transform=`scale(${0.5+0.5*p})`; });
  e.subs.forEach(s=>{ const t0=+s.dataset.in; const p=clamp((t-t0)/0.22); s.style.opacity=eo(p); s.style.transform=`translateY(${8*(1-eo(p))}px)`; });
  if(e.states){ let c=''; for(const s of e.states) if(t>=s.t) c=s.c; d.classList.remove('on','off'); if(c) d.classList.add(c); }
}
// ===== captions (M01/M02) =====
let PHR=[];
function measure(txt){ const c=measure.c||(measure.c=document.createElement('canvas').getContext('2d')); c.font="600 52px 'Avenir Next'"; return c.measureText(txt).width; }
function buildCaptions(){
  // 1) clauses at punctuation + scene boundaries; 2) merge 1-word clauses within a sentence; 3) split long clauses evenly.
  const W=WORDS, maxW=CFG.capMaxW||640, maxN=CFG.capMaxWords||4, fits=a=>a.length<=maxN && measure(a.map(i=>W[i].w).join(' '))+(a.length-1)*13<=maxW;
  const bounds=[CFG.s1End, CFG.s2End]; let cl=[], cur=[];
  for(let i=0;i<W.length;i++){
    if(cur.length && bounds.some(b=>W[cur[cur.length-1]].s<b && W[i].s>=b)) { cl.push({w:cur,end:true}); cur=[]; }
    cur.push(i);
    if(/[.?!]$/.test(W[i].w)){ cl.push({w:cur,end:true}); cur=[]; }
    else if(/[,:;]$/.test(W[i].w)){ cl.push({w:cur,end:false}); cur=[]; }
  }
  if(cur.length) cl.push({w:cur,end:true});
  for(let k=0;k<cl.length;k++){ // merge short clause with next clause of same sentence
    const c=cl[k], n=cl[k+1];
    if(c.w.length<=(fits(c.w.concat(n?n.w:[]))?2:1) && !c.end && n){ n.w=c.w.concat(n.w); cl.splice(k,1); k--; }
    else if(n && !c.end && n.w.length===1 && fits(c.w.concat(n.w))){ c.w=c.w.concat(n.w); c.end=n.end; cl.splice(k+1,1); k--; }
  }
  for(const c of cl){
    if(fits(c.w)){ PHR.push(c.w); continue; }
    for(let n=2;n<12;n++){ const sz=Math.ceil(c.w.length/n), parts=[];
      for(let j=0;j<c.w.length;j+=sz) parts.push(c.w.slice(j,j+sz));
      if(parts[parts.length-1].length===1 && parts.length>1){ const l=parts.pop(); parts[parts.length-1].push(l[0]); }
      if(parts.every(fits)){ PHR.push(...parts); break; } }
  }
}
function seekCap(t, mode){
  const cap=document.getElementById('cap'); const W=WORDS;
  cap.className = ''; cap.style.top = mode==='s1' ? (CFG.s1CapTop||600)+'px' : '770px';
  if(mode==='none'){cap.innerHTML='';return}
  let k=-1; for(let i=0;i<PHR.length;i++) if(t >= W[PHR[i][0]].s - 1/FPS) k=i;
  if(k<0){cap.innerHTML='';return}
  const ph=PHR[k];
  if(cap.dataset.k!=k){ cap.dataset.k=k; cap.innerHTML=ph.map(i=>`<span class="w">${W[i].w.replace(/^(\d)/,'$1')}</span>`).join(''); }
  [...cap.children].forEach((sp,j)=>{ const s=W[ph[j]].s-1/FPS; if(t<s){sp.style.opacity=0;return}
    const p=eo(clamp((t-s)/0.12)); sp.style.opacity=0.4+0.6*p; sp.style.transform=`translateY(${11*(1-p)}px)`; });
}
// ===== scene seek =====
function seek(t){
  const sc = t < CFG.s1End ? 's1' : (t < CFG.s2End ? 's2' : 's3');
  document.getElementById('s1').style.display = sc==='s1'?'block':'none';
  document.getElementById('s3').style.display = sc==='s3'?'block':'none';
  if(sc==='s3') for(const e of ELS) seekEl(e,t);
  if(CFG.endT!=null){ const h=document.getElementById('cardhdr'); h.style.opacity = 1-clamp((t-CFG.endT)/0.25); }
  if(sc==='s1') QW.forEach((q,k)=>{ const w=WORDS[k]; const p=w? eo(clamp((t-(w.s-1/FPS))/0.12)) : 0; q.style.color=`rgba(43,47,58,${0.22+0.78*p})`; });
  seekCap(t, sc==='s2' ? 'none' : sc);
}
window.__ready = () => { build(); return PHR.map(p=>p.map(i=>WORDS[i].w).join(' ')); };
window.seek = seek;
</script>
</body></html>
