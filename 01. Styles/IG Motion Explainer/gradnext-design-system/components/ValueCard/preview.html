<!doctype html>
<html>
<head><meta charset="utf-8"><title>ValueCard — preview</title>
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;padding:var(--space-3)} .grid{display:grid;grid-template-columns:repeat(3,minmax(0,200px));gap:var(--space-3);padding:var(--space-4);background:var(--background-04);justify-content:center}</style></head>
<body>
<div id="root"></div>
<script>
  var G = window.Gradnext, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'grid'},['First-Principles Thinking','Real-World Relevance','Clarity Over Complexity','Ownership of Thinking','Long-Term Impact'].map(function(t){return h(G.ValueCard,{key:t},t);})));
</script>
</body>
</html>
